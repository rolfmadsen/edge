<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e222d"/>
      <stop offset="100%" stop-color="#0f1117"/>
    </linearGradient>
    <linearGradient id="edge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background App Tile -->
  <rect width="256" height="256" rx="56" fill="url(#bg-grad)"/>
  <rect width="254" height="254" x="1" y="1" rx="55" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Orthogonal Connection Line -->
  <path d="M 80 160 L 80 96 L 168 96" fill="none" stroke="url(#edge-grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Directed Half-Arrow (Barb) at Target Node -->
  <path d="M 152 82 L 168 96" fill="none" stroke="#818cf8" stroke-width="8" stroke-linecap="round"/>

  <!-- Source Node (Concept/Class) -->
  <g filter="url(#shadow)">
    <rect x="52" y="140" width="76" height="52" rx="10" fill="#252b3b" stroke="#38bdf8" stroke-width="4"/>
    <!-- Node Header -->
    <rect x="52" y="140" width="76" height="18" rx="10" fill="#38bdf8" fill-opacity="0.2"/>
    <line x1="52" y1="158" x2="128" y2="158" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="80" cy="160" r="4" fill="#38bdf8"/>
  </g>

  <!-- Target Node (Concept/Class) -->
  <g filter="url(#shadow)">
    <rect x="144" y="68" width="76" height="56" rx="10" fill="#252b3b" stroke="#818cf8" stroke-width="4"/>
    <!-- Node Header -->
    <rect x="144" y="68" width="76" height="18" rx="10" fill="#818cf8" fill-opacity="0.2"/>
    <line x1="144" y1="86" x2="220" y2="86" stroke="#818cf8" stroke-width="2"/>
    <!-- Attribute lines -->
    <line x1="154" y1="98" x2="194" y2="98" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="154" y1="108" x2="182" y2="108" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="168" cy="96" r="4" fill="#818cf8"/>
  </g>
</svg>
