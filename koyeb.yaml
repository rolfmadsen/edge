# Koyeb App Specification for Kant Stateless In-Memory Relay
# Documentation: https://www.koyeb.com/docs/reference/koyeb-yaml
# Image is built and pushed to ghcr.io by .github/workflows/relay-docker.yml on each release tag.
app:
  name: kant-relay
services:
  - name: kant-relay-service
    type: web
    image: ghcr.io/rolfmadsen/kant-relay:latest
    ports:
      - port: 8080
        path: /
        protocol: http
    env:
      - key: PORT
        value: "8080"
      - key: HOST
        value: "0.0.0.0"
      - key: RUST_LOG
        value: "info"
    health_checks:
      - path: /health
        port: 8080
        protocol: http
        interval: 30
        timeout: 5
    regions:
      - fra
    scalings:
      - min: 1
        max: 1
    instance_type: nano
