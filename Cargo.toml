[workspace]
members = [
    ".",
    "crates/edge-relay",
]
resolver = "2"

[package]
name = "edge"
version = "0.1.0"
edition = "2021"
authors = ["Rolf Madsen"]
license = "MIT"
description = "Desktop applikation til FDA begrebs- og informationsmodellering i Rust og Iced"

[package.metadata.deb]
maintainer = "Rolf Madsen"
copyright = "2026 Rolf Madsen"
license-file = ["LICENSE", "0"]
extended-description = "Edge er en moderne skrivebordsapplikation til FDA begrebs- og informationsmodellering bygget i Rust og Iced."
section = "graphics"
priority = "optional"
assets = [
    ["target/x86_64-unknown-linux-gnu/release/edge", "usr/bin/edge", "755"],
    ["assets/edge.desktop", "usr/share/applications/edge.desktop", "644"],
    ["assets/icons/edge.svg", "usr/share/icons/hicolor/scalable/apps/edge.svg", "644"],
]

[dependencies]
iced = { version = "0.14.0", features = ["wgpu", "tiny-skia", "canvas"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
url = { version = "2.5", features = ["serde"] }
thiserror = "1.0"
libc = "0.2"
chacha20poly1305 = "0.10"
tokio-tungstenite = "0.26"
tokio = { version = "1.43", features = ["rt", "sync", "time", "macros"] }
base64 = "0.22"
rand = "0.9"
futures-util = "0.3"

[dev-dependencies]
proptest = "1.5"
edge-relay = { path = "crates/edge-relay" }
