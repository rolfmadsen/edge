name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: edge-linux-x86_64
            archive_file: edge-linux-x86_64.tar.gz
            is_windows: false

          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: edge-macos-aarch64
            archive_file: edge-macos-aarch64.tar.gz
            is_windows: false

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: edge-windows-x86_64
            archive_file: edge-windows-x86_64.zip
            is_windows: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxinerama-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libvulkan1 \
            libasound2-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package release archive (Unix)
        if: ${{ !matrix.is_windows }}
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/edge" dist/
          chmod +x dist/edge
          cp README.md LICENSE dist/ 2>/dev/null || true
          tar -czf "${{ matrix.archive_file }}" -C dist .
          shasum -a 256 "${{ matrix.archive_file }}" > "${{ matrix.archive_file }}.sha256"

      - name: Package release archive (Windows)
        if: ${{ matrix.is_windows }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/edge.exe" -Destination dist/
          if (Test-Path "README.md") { Copy-Item "README.md" -Destination dist/ }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" -Destination dist/ }
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.archive_file }}"
          $hash = (Get-FileHash -Algorithm SHA256 -Path "${{ matrix.archive_file }}").Hash.ToLower()
          "$hash  ${{ matrix.archive_file }}" | Out-File -Encoding ascii "${{ matrix.archive_file }}.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.archive_file }}
            ${{ matrix.archive_file }}.sha256

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
