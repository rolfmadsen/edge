version: '3.8'

services:
  kant-relay:
    build:
      context: .
      dockerfile: crates/kant-relay/Dockerfile
    container_name: kant-relay
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - RUST_LOG=info,kant_relay=debug
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
